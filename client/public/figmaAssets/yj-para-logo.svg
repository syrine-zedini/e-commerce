<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <!-- Elegant Accent - A thin gold circle with a glowing sparkle/cross -->
  <g transform="translate(10, 0)">
    <!-- Outer thin ring -->
    <circle cx="25" cy="30" r="18" fill="none" stroke="#1D8EE6" stroke-width="1" opacity="0.7" />
    
    <!-- Elegant 4-pointed sparkle / stylized cross -->
    <path d="M 25 16 L 26.5 28.5 L 39 30 L 26.5 31.5 L 25 44 L 23.5 31.5 L 11 30 L 23.5 28.5 Z" fill="#1D8EE6" />
    <circle cx="25" cy="30" r="3" fill="#ffffff" />
  </g>

  <!-- "YJ PARA" text - smaller size, refined spacing -->
  <text x="70" y="39" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-weight="bold" 
        font-size="26" 
        fill="#1D8EE6" 
        letter-spacing="4">YJ PARA</text>
        
  <!-- Very subtle elegant underline under PARA -->
  <line x1="72" y1="48" x2="210" y2="48" stroke="#1D8EE6" stroke-width="0.5" opacity="0.3" />
</svg>
